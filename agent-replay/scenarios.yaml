# agent-replay scenarios. Each entry is (agent module, input prompt, run count).
# `agent-replay record <name>` runs it `runs` times and derives contracts/<name>.yaml from the
# results. Add scenarios by hand or via `agent-replay init`.

scenarios:
- name: vulnerable-dependency
  agent: audit_agent
  input: Audit the dependencies pinned in file:///D:/Project/agent_replay/requirements.txt and give a deploy verdict.
  runs: 3
- name: customer-refund
  agent: agent
  input: Customer says order A-1001 never arrived. Look it up and decide what to do.
  runs: 2

# Regex patterns applied to every recorded string (tool arguments, tool output, model answers)
# before anything is written to disk or AWS. A blunt instrument, not a guarantee: a pattern that
# doesn't match won't redact, and a pattern that's too broad will over-redact. Review a scenario's
# own recording before trusting this for anything actually sensitive. See README.md.
redact: []
